# ============================================================================
# LabelLess AI — Pipeline Configuration (Single Source of Truth)
#
# Every weight, threshold, class name and hyperparameter lives here.
# Python scripts import via scripts/load_config.py.
# The React UI consumes public/pipeline_config.json, generated by:
#     python scripts/export_config_for_ui.py
#
# After editing this file, re-run export_config_for_ui.py so the UI matches.
# ============================================================================

# ── Project Metadata ────────────────────────────────────────────────────────
project:
  name: "DisasterVision YOLOv8"
  dataset_name: "Multi-Disaster Active Learning Dataset"
  model_type: "YOLOv8"
  model_version: "v2.3 Fine-Tuned"

# ── Object Detection Classes ────────────────────────────────────────────────
# Order matters: index = YOLO class ID.
classes:
  - id: 0
    yolo_name: "undamagedbuilding"
    display_name: "Undamaged Building"
    color_hex: "#10B981"
    tailwind_key: "emerald"

  - id: 1
    yolo_name: "damagedbuilding"
    display_name: "Damaged Building"
    color_hex: "#F43F5E"
    tailwind_key: "rose"

  - id: 2
    yolo_name: "fire"
    display_name: "Fire"
    color_hex: "#F59E0B"
    tailwind_key: "amber"

  - id: 3
    yolo_name: "smoke"
    display_name: "Smoke"
    color_hex: "#A855F7"
    tailwind_key: "purple"

# ── Active Learning Ranking Weights ─────────────────────────────────────────
# These three MUST sum to 1.0.
# priority_score = w_uncertainty * uncertainty + w_rare_class * rare + w_diversity * diversity
ranking:
  w_uncertainty: 0.70
  w_rare_class: 0.20
  w_diversity:  0.10

  # Uncertainty sub-blend: score = blend_avg * (1-avg_conf) + (1-blend_avg) * (1-min_conf)
  uncertainty_blend_avg: 0.60

  # Diversity heuristic thresholds (based on # of bounding boxes)
  diversity_scores:
    many: 0.85      # > diversity_box_thresholds.many boxes
    moderate: 0.65   # > diversity_box_thresholds.moderate boxes
    none: 0.50       # 0 boxes
    few: 0.35        # 1-2 boxes
  diversity_box_thresholds:
    many: 4
    moderate: 2

# ── Auto-Label / Human-Review Routing ───────────────────────────────────────
routing:
  confidence_threshold: 0.85   # >= this → auto-label candidate
  auto_label_priority_max: 0.58  # priority < this → auto-labeled, else → pending

  # Priority level display cutoffs (for UI badges)
  priority_levels:
    critical: 0.70
    high: 0.58
    medium: 0.40
    # anything below medium → "low"

# ── Training Hyperparameters ────────────────────────────────────────────────
training:
  base_model: "yolov8n.pt"
  epochs_seed: 50        # Round 0
  epochs_round: 20       # Round N >= 1
  batch_size: 16
  image_size: 640
  patience: 10

# ── Dataset Split Ratios ────────────────────────────────────────────────────
dataset:
  seed_pct: 0.10
  pool_pct: 0.70
  test_pct: 0.20
  random_seed: 42
  total_pool_fallback: 971   # fallback when pool dir is unavailable

# ── Paths (relative to project root) ───────────────────────────────────────
paths:
  predictions: "outputs/predictions.json"
  ranked_queue: "inputs/ranked_queue.json"
  human_labels: "inputs/human_labels.json"
  data_dir: "data"
  ui_dataset: "public/ranked_dataset.json"
  ui_config: "public/pipeline_config.json"
